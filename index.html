<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ede9df"><title>なぞなぞ崩壊 | ASOBEAT</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho",serif;color:#2f302a;background:#ede9df}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 80% 0%,#f7f3e9 0,transparent 54%),repeating-linear-gradient(90deg,transparent 0 4px,#5551 4px 4.5px),#eeeae0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}main{width:min(100%,520px);margin:auto;padding:27px 20px 50px}.header{text-align:center;padding:10px 0 18px}.brand{font-family:Arial,sans-serif;letter-spacing:.28em;color:#807e72;font-size:10px}.crest{font-size:31px;color:#a33c31;line-height:1.3;margin:17px 0 8px}h1{font-weight:600;font-size:clamp(32px,8.5vw,44px);letter-spacing:.1em;line-height:1.35;margin:0}.subtitle{margin:13px auto 0;font-size:13px;letter-spacing:.12em;color:#777368;line-height:1.8}.divider{width:60px;height:1px;background:#aa493c;margin:20px auto 0}.paper{position:relative;margin:18px 0 22px;padding:27px 22px 31px;background:#faf8f1;border:1px solid #d3cbb9;box-shadow:0 8px 22px #38301e13,inset 0 0 0 7px #faf8f1,inset 0 0 0 8px #e9e1d1;min-height:190px}.paper:after{content:'謎';position:absolute;right:14px;bottom:12px;border:2px solid #ad4a3b;color:#ad4a3b;width:32px;height:32px;display:grid;place-items:center;font-size:17px;transform:rotate(-8deg);opacity:.82}.label{font-size:11px;color:#8b8577;letter-spacing:.16em;margin-bottom:17px}.sentence{font-size:clamp(20px,5.5vw,27px);font-weight:600;line-height:2.0;overflow-wrap:anywhere;min-height:86px;padding-right:4px}.word{color:#a33c31;border-bottom:1px dotted #b96c5d}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#faf8f1;color:#36382e;border:1px solid #bcb5a7;padding:13px 8px;min-height:49px;font-size:14px;border-radius:3px;letter-spacing:.04em;box-shadow:0 2px 0 #bcb5a7}.btn:active{transform:translateY(2px);box-shadow:none}.primary{background:#a5483a;border-color:#a5483a;color:#fff}.accent{background:#333e36;border-color:#333e36;color:#fff}.wide{grid-column:1/-1}.section-title{font-size:18px;letter-spacing:.13em;font-weight:600;margin:32px 0 14px;padding-left:12px;border-left:3px solid #a5483a}.slot{display:grid;grid-template-columns:26px minmax(0,1fr) 74px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #d7d0c1}.num{font-family:Georgia,serif;color:#a5483a;font-size:17px;text-align:center}.slot input{width:100%;min-width:0;background:#faf8f1;border:1px solid #cfc6b4;border-radius:2px;padding:12px 10px;font-size:16px;outline:none;color:#34332d}.slot input:focus{border-color:#a5483a;box-shadow:0 0 0 2px #a5483a22}.small{border:1px solid #bdb3a2;background:#e7e1d4;border-radius:2px;font-size:12px;padding:12px 3px;color:#4c4a42}.hint{font-size:12px;color:#817b70;line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar label{font-size:12px;color:#6f6a60}.toolbar select{background:#faf8f1;border:1px solid #bdb3a2;border-radius:2px;padding:9px;font-size:14px}.saved{display:grid;gap:10px}.saved-item{background:#faf8f1;border:1px solid #d6cebd;padding:14px}.saved-text{font-size:14px;line-height:1.8;overflow-wrap:anywhere}.saved-actions{display:flex;gap:8px;margin-top:10px}.saved-actions button{background:#e8e2d5;border:1px solid #d4cbbb;padding:8px 12px;font-size:12px}.footer{text-align:center;color:#8a8579;font-size:11px;line-height:1.8;margin-top:35px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#343e36;color:#fff;padding:12px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}.toast.show{opacity:1}@media(max-width:360px){main{padding-left:14px;padding-right:14px}.slot{gap:7px;grid-template-columns:22px minmax(0,1fr) 68px}.small{font-size:11px}}
</style></head><body><main>
<header class="header"><div class="brand">ASOBEAT · KOTOBA ASOBI</div><div class="crest">◈</div><h1>なぞなぞ崩壊</h1><p class="subtitle">言葉をつなぐ、意味がほどける。<br>おかしな問いを、一句どうぞ。</p><div class="divider"></div></header>
<section class="paper" aria-live="polite"><div class="label">本日のなぞなぞ</div><div class="sentence" id="preview"></div></section>
<div class="controls"><button class="btn primary wide" id="all">すべておまかせで作る</button><button class="btn" id="copy">文章を写す</button><button class="btn accent" id="share">Xに投稿する</button><button class="btn wide" id="save">お気に入りに残す</button></div>
<h2 class="section-title">言葉を選ぶ</h2><div class="toolbar"><label for="length">おまかせの文字数</label><select id="length"><option value="all">2〜4文字</option><option value="2">2文字</option><option value="3">3文字</option><option value="4">4文字</option></select></div><div id="slots"></div><p class="hint">言葉は自由に書き換えられます。「おまかせ」で一つずつ入れ替えることもできます。ランダムでは実在する言葉だけを使用します。</p>
<h2 class="section-title">お気に入り <span id="count"></span></h2><div class="saved" id="saved"></div><footer class="footer">ASOBEAT · 日常にアソビのスパイスを。<br>保存した作品は、この端末のブラウザに残ります。</footer></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const banks={noun:{"2":["ねこ","いぬ","うし","くま","さる","かに","たこ","いか","かめ","へび","とり","ふぐ","かば","えび","うま","しか","ぞう","ろば","やぎ","ぶた","りす","うに","たい","こい","はと","つる","わし","あり","はち","くも","せみ","かき","なし","もも","うめ","くり","いも","なす","まめ","ねぎ","にら","すし","もち","ぱん","こめ","そば","みそ","しお","さけ","ちゃ","みず","あめ","ゆき","かぜ","そら","うみ","やま","かわ","いけ","もり","はな","くさ","つき","ほし","にじ","あさ","ひる","よる","ゆめ","うそ","こえ","うた","おと","かお","みみ","くつ","かさ","ふね","いす","ほん","かぎ","はこ","ふく","いえ","まど","かべ","ゆか","まち","みち","はし","えき","たび","くに","ひと","おや","まご","ねつ","あせ","くせ","なぞ","くじ","ひも","まる","さば","たら","ピザ","のり","ふで","くし","こま","いご","おに","バス","ふえ","きり","しま","たき","いわ","すな","つち","いし","たね","えだ","まつ","たけ","すぎ","トラ","トド","サメ","エイ","ワニ"],"3":["うどん","めがね","くるま","つくえ","かばん","こども","おとな","しかく","パンダ","キリン","うさぎ","ゴリラ","たぬき","きつね","こあら","あひる","ひよこ","すずめ","からす","つばめ","くらげ","いるか","くじら","らくだ","ひつじ","ねずみ","とかげ","かえる","まぐろ","かつお","さんま","いわし","かれい","ほたて","あさり","しじみ","こんぶ","わかめ","もずく","ひじき","さくら","つばき","すみれ","つつじ","もみじ","きのこ","しめじ","えのき","ごぼう","トマト","レタス","とうふ","たまご","ちくわ","おでん","おかゆ","おこめ","おもち","おすし","カレー","パスタ","サラダ","スープ","プリン","ゼリー","ケーキ","チョコ","アイス","バナナ","りんご","みかん","いちご","メロン","すいか","ぶどう","レモン","ライム","キウイ","おちゃ","ミルク","ココア","おふろ","まくら","ふとん","こたつ","たたみ","ノート","はさみ","すずり","しおり","てがみ","きって","はがき","でんわ","とけい","かがみ","ぼうし","マスク","リボン","ボタン","さいふ","うちわ","せんす","はなび","だるま","かるた","おばけ","てんぐ","かっぱ","まほう","おうじ","しごと","かいぎ","てすと","しけん","きしゃ","バイク","きっぷ","きんこ","えいが","まんが","アニメ","ゲーム","テレビ","ラジオ","カメラ","たいこ","ピアノ","ギター","あらし","じしん","さばく","いずみ","ねっこ","はっぱ","ひのき","もぐら","ヒョウ","コアラ","ラッコ","シャチ","カエル","イモリ","ヤモリ","トンボ","チョウ","バッタ","ミミズ"],"4":["さんかく","いのしし","しまうま","しろくま","アルパカ","カピバラ","たんぽぽ","ひまわり","あじさい","いちょう","しいたけ","まいたけ","たけのこ","だいこん","にんじん","れんこん","きゅうり","キャベツ","たまねぎ","かぼちゃ","ピーマン","なっとう","かまぼこ","おにぎり","たこやき","からあげ","やきとり","やきそば","ラーメン","シチュー","グラタン","オムレツ","コロッケ","ドーナツ","クッキー","マンゴー","パパイヤ","こうちゃ","コーヒー","サイダー","ジュース","ざぶとん","えんぴつ","けしごむ","くつした","ふうりん","おまつり","おみくじ","おまもり","けんだま","すごろく","しょうぎ","ゆうれい","にんじゃ","さむらい","とのさま","おうさま","せんせい","がくせい","かいしゃ","てんいん","えんそく","りょこう","でんしゃ","タクシー","ひこうき","ぎんこう","がっこう","こうえん","しゃしん","おんがく","たいよう","かみなり","たいふう","くすのき","こうもり","きつつき","ふくろう","ペンギン","ダチョウ","ライオン","チーター","オオカミ","ハイエナ","ワラビー","アザラシ","セイウチ","イグアナ","クワガタ","カマキリ","コオロギ","ナメクジ"]},adj:{"2":["へん","へた","すき","ひま","らく","だめ","むだ","いや","まれ","じみ","はで"],"3":["きらい","ふしぎ","きれい","げんき","しずか","すてき","りっぱ","へいき","まじめ","ふこう","ふあん","きけん","ふべん","べんり","ふつう","ぶきみ","ふしん","ふめい","ごうか","かれい","ふまん","じゆう","ひみつ","ひっし","きゅう","かのう","きらく","げひん","すなお","がんこ"],"4":["にぎやか","じょうず","てきとう","ざんねん","たいへん","しんせつ","ていねい","しあわせ","あんしん","あんぜん","かんたん","ふくざつ","とくべつ","へいぼん","どくとく","きみょう","ふかしぎ","まんまる","ふわふわ","もこもこ","つるつる","ぴかぴか","きらきら","ぼろぼろ","ばらばら","ぎりぎり","すれすれ","いろいろ","さまざま","ばくぜん","せいかく","せんさい","おしゃれ","ぜいたく","びみょう","てきせつ","まんぞく","ないしょ","だいたん","れいせい","ねっしん","ふかのう","けんこう","しんけん","しんせん","むじゃき"]}};
const slots=[{hint:'最初の「○○は」',value:'ぞう'},{hint:'「○○でも」',value:'ろば'},{hint:'「○○な」',value:'ふしぎ'},{hint:'「○○って」',value:'キリン'},{hint:'「○○だ？」',value:'パンダ'}];
const $=id=>document.getElementById(id);let saved=[];try{const a=JSON.parse(localStorage.getItem('asobeat_nazonazo_saved_v1')||'[]');if(Array.isArray(a))saved=a.filter(x=>Array.isArray(x)&&x.length===5).slice(0,30)}catch{}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function values(){return slots.map(s=>s.value.trim()||'○○')}
function sentence(a=values()){return `${a[0]}は${a[1]}でも、${a[2]}な${a[3]}って${a[4]}だ？`}
function renderPreview(){const a=values();$('preview').innerHTML=`<span class="word">${escapeHTML(a[0])}</span>は<span class="word">${escapeHTML(a[1])}</span>でも、<span class="word">${escapeHTML(a[2])}</span>な<span class="word">${escapeHTML(a[3])}</span>って<span class="word">${escapeHTML(a[4])}</span>だ？`}
let currentRole='noun';function randomWord(role='noun'){currentRole=role;const l=$('length').value;const sizes=l==='all'?[2,3,4]:[Number(l)];const available=sizes.filter(n=>banks[currentRole][n].length);const size=available[Math.floor(Math.random()*available.length)];const list=banks[currentRole][size];return list[Math.floor(Math.random()*list.length)]}
function change(i){let next=randomWord(i===2?'adj':'noun');for(let t=0;t<12&&next===slots[i].value;t++)next=randomWord(i===2?'adj':'noun');slots[i].value=next;$('input'+i).value=next;renderPreview()}
function renderSlots(){const root=$('slots');root.replaceChildren();slots.forEach((s,i)=>{const row=document.createElement('div');row.className='slot';const num=document.createElement('div');num.className='num';num.textContent=i+1;const input=document.createElement('input');input.id='input'+i;input.value=s.value;input.maxLength=24;input.setAttribute('aria-label',s.hint);input.placeholder=s.hint;input.addEventListener('input',()=>{s.value=input.value;renderPreview()});const btn=document.createElement('button');btn.className='small';btn.textContent='おまかせ';btn.setAttribute('aria-label',`${i+1}番の単語をランダム変更`);btn.addEventListener('click',()=>change(i));row.append(num,input,btn);root.append(row)})}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました！')}catch{const area=document.createElement('textarea');area.value=t;document.body.append(area);area.select();try{document.execCommand('copy');toast('コピーしました！')}catch{toast('コピーできませんでした')}area.remove()}}
function persist(){try{localStorage.setItem('asobeat_nazonazo_saved_v1',JSON.stringify(saved))}catch{toast('保存できませんでした')}}
function renderSaved(){$('count').textContent=`(${saved.length}/30)`;const root=$('saved');root.replaceChildren();if(!saved.length){const p=document.createElement('p');p.className='hint';p.textContent='まだ保存した作品はありません。';root.append(p);return}saved.forEach((a,i)=>{const item=document.createElement('div');item.className='saved-item';const t=document.createElement('div');t.className='saved-text';t.textContent=sentence(a);const actions=document.createElement('div');actions.className='saved-actions';const load=document.createElement('button');load.textContent='編集する';load.onclick=()=>{a.forEach((v,j)=>{slots[j].value=v;$('input'+j).value=v});renderPreview();window.scrollTo({top:0,behavior:'smooth'});toast('読み込みました')};const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{saved.splice(i,1);persist();renderSaved()};actions.append(load,del);item.append(t,actions);root.append(item)})}
$('all').addEventListener('click',()=>{slots.forEach((s,i)=>change(i));toast('新しいなぞなぞができました')});$('copy').addEventListener('click',()=>copyText(sentence()));$('share').addEventListener('click',()=>{const text=`🤯 なぞなぞ崩壊！\n\n「${sentence()}」\n\nあなたも作ってみて！\n#なぞなぞ崩壊 #バカゲー #ブラウザゲーム`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')});$('save').addEventListener('click',()=>{const a=values();if(saved.some(x=>JSON.stringify(x)===JSON.stringify(a))){toast('すでに保存されています');return}saved.unshift(a);saved=saved.slice(0,30);persist();renderSaved();toast('お気に入りに保存しました')});renderSlots();renderPreview();renderSaved();
})();
</script></body></html>
